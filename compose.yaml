services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: invite
      POSTGRES_PASSWORD: invite
      POSTGRES_DB: invite
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U invite -d invite']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
